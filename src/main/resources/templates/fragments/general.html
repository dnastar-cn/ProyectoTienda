<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>

<div th:fragment="menu" class="menu-principal">

    <div class="menu-principal">
        <span th:text="#{panel.administracion}">Panel de administración</span>
        <a class="menu-principal" href="../" th:text="#{volver.tienda}">Volver a la tienda</a>
    </div>

    <div>
        <span th:text="#{titulo.bienvenida}"></span>
    </div>

    <div th:replace="~{fragments/general.html :: idiomas}"></div>

    <nav class="menu-principal" th:aria-label="#{admin.menu.titulo}">
        <a href="gestionarFiguras" th:text="#{admin.menu.figuras}">Figuras</a>
        <a href="#" th:text="#{admin.menu.usuarios}">Usuarios</a>
        <a href="#" th:text="#{admin.menu.categorias}">Categorías</a>
        <a href="gestionarPedidos" th:text="#{admin.menu.pedidos}">Pedidos</a>
    </nav>
</div>

<!-- selector de idioma: se usa en el admin y en index.html.
     Los nombres de los idiomas no se traducen: cada uno va en su propio idioma -->
<div th:fragment="idiomas">
    <a href="?idioma=es">Español</a>
    <a href="?idioma=en">English</a>
    <a href="?idioma=ja">日本語</a>
</div>

</body>
</html>
