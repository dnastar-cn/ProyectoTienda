<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style type="text/tailwindcss">
            @theme {
                --color-fondo: #fde68a;
            }

            @layer base {
                body {
                    @apply bg-fondo;
                }
            }
            
            @layer components {
                .imagen-producto{
                    @apply h-35 m-2.5 transition-all duration-400 hover:scale-120;
                }
            }
        </style>
    </th:block>
</head>
</html>
