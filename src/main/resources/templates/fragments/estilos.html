<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style type="text/tailwindcss">
            @theme {
                --color-fondo: #fde68a;
                --color-error: #dc2626;
            }

            @layer base {
                body {
                    @apply bg-fondo;
                }
            }
            
            @layer components {
                .imagen-producto{
                    @apply h-35 m-2.5 transition-all duration-400 hover:scale-120;
                }

                .tarjeta-producto{
                    @apply m-2.5;
                }
                .input{
                    @apply bg-white;
                }
                .input-cantidad{
                    @apply text-right pr-2 w-12.5;
                }
                .menu-principal a{
                    @apply m-2.5 underline;
                }
                .mensaje-error{
                    @apply text-error;
                }
            }
        </style>
    </th:block>
</head>
</html>
