<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style type="text/tailwindcss">
            @theme {
                --color-fondo: #fde68a;
                --color-error: #dc2626;
                --color-primario: #2529DC;
            }

            @layer base {
                body {
                    @apply bg-fondo;
                }
            }
            
            @layer components {
                .imagen-producto{
                    @apply h-35 m-2.5 transition-all duration-400 hover:scale-120;
                }

                .tarjeta-producto {
                    @apply flex flex-col gap-2;
                }

                .vitrina {
                    @apply aspect-square bg-white rounded-lg overflow-hidden flex items-center justify-center p-4;
                }

                .imagen-vitrina {
                    @apply w-full h-full object-contain transition-transform duration-300 ease-out hover:scale-105;
                }

                .tarjeta-titulo {
                    @apply font-semibold;
                }

                .tarjeta-datos {
                    @apply flex justify-between items-baseline;
                }

                .tarjeta-precio {
                    @apply font-bold;
                }

                .tarjeta-acciones {
                    @apply flex flex-wrap items-center gap-2;
                }

                .input{
                    @apply bg-white border;
                }

                .input-cantidad{
                    @apply text-right pr-2 w-12.5;
                }

                .menu-principal a{
                    @apply m-2.5 underline;
                }

                .mensaje-error{
                    @apply text-error;
                }

                .btn{
                    @apply bg-primario text-white p-2;
                }

                .catalogo {
                    @apply grid grid-cols-2 gap-6 p-6 md:grid-cols-3 lg:grid-cols-4;
                }
            }
        </style>
    </th:block>
</head>
</html>
