<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

        <style type="text/tailwindcss">
            @theme {
                /* fondo y paneles */
                --color-fondo: #f6f3ee;
                --color-superficie: #ffffff;
                --color-borde: #e3ddd3;

                /* texto */
                --color-texto: #1f1b16;
                --color-texto-suave: #5c5346;

                /* botones y avisos */
                --color-primario: #2529DC;
                --color-acento: #fde68a;
                --color-error: #dc2626;
                --color-exito: #15803d;

                --font-sans: "Instrument Sans", ui-sans-serif, system-ui, "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
            }

            @layer base {
                body {
                    @apply bg-fondo text-texto antialiased;
                }
                h1, h2, h3 {
                    @apply text-balance;
                }
                ::selection {
                    @apply bg-acento text-texto;
                }
                :focus-visible {
                    @apply outline-2 outline-offset-2 outline-primario;
                }
                /* placeholder de los inputs, que se lea bien */
                ::placeholder {
                    @apply text-texto-suave/85;
                }
            }

            @layer components {

                /* estructura */

                /* ancho y margenes de todas las paginas */
                .pagina {
                    @apply mx-auto w-full max-w-6xl px-4 md:px-6;
                }

                .cabecera {
                    @apply bg-fondo/95 border-b border-borde md:sticky md:top-0 md:z-10 md:backdrop-blur;
                }

                .cabecera-fila {
                    @apply flex flex-wrap items-center justify-between gap-x-6 gap-y-2 py-3;
                }

                .marca {
                    @apply text-xl font-bold tracking-tight;
                }

                .pie {
                    @apply mt-16 border-t border-borde py-6 flex flex-wrap items-center justify-between gap-4 text-sm text-texto-suave;
                }

                .pie a {
                    @apply hover:text-texto underline-offset-4 hover:underline;
                }

                .selector-idiomas {
                    @apply flex gap-3;
                }

                .introduccion {
                    @apply pt-8 pb-2 flex flex-col gap-1;
                }

                /* menu de la tienda */

                .menu-principal {
                    @apply flex flex-wrap items-center gap-x-1 gap-y-1 -mx-2 pb-2 text-sm;
                }

                .menu-principal a {
                    @apply block rounded-md px-2 py-1.5 font-medium text-texto-suave transition-colors hover:bg-superficie hover:text-texto;
                }

                /* enlaces que solo se ven cuando el usuario se identifica */
                .enlace-carrito, .enlace-pedidos, .enlace-mis_datos, .enlace-cerrar_sesion {
                    @apply hidden;
                }

                .usuario-actual {
                    @apply flex items-center gap-1 text-sm font-medium text-texto-suave;
                }

                .avatar-usuario {
                    @apply inline-block w-8 h-8 rounded-full object-cover ml-2 align-middle border border-borde;
                }

                /* botones enlaces y formularios */

                .btn {
                    @apply inline-flex items-center justify-center bg-primario text-white font-medium px-4 py-2 rounded-md transition-colors hover:bg-primario/85 active:bg-primario cursor-pointer;
                }

                .btn-secundario {
                    @apply inline-flex items-center justify-center bg-superficie text-texto font-medium px-3 py-1.5 rounded-md border border-borde transition-colors hover:border-texto-suave cursor-pointer;
                }

                .enlace {
                    @apply text-primario underline-offset-4 hover:underline;
                }

                .input {
                    @apply bg-superficie border border-borde rounded-md px-2.5 py-2 text-texto transition-colors hover:border-texto-suave/60 focus:border-primario focus:outline-none focus:ring-2 focus:ring-primario/20;
                }

                .input-cantidad {
                    @apply text-right pr-2 w-16 py-1.5;
                }

                .formulario {
                    @apply flex flex-col gap-4;
                }

                .campo {
                    @apply flex flex-col gap-1.5 text-sm font-medium text-texto-suave;
                }

                .campo .input {
                    @apply text-base font-normal;
                }

                .casilla {
                    @apply flex items-center gap-2 text-sm text-texto-suave;
                }

                .opcion {
                    @apply flex items-center gap-3 rounded-lg border border-borde bg-superficie px-4 py-3 cursor-pointer transition-colors hover:border-texto-suave/60 has-[:checked]:border-primario has-[:checked]:ring-2 has-[:checked]:ring-primario/15;
                }

                .mensaje-error {
                    @apply text-sm text-error;
                }

                .aviso-error {
                    @apply rounded-md border border-error/30 bg-error/5 px-4 py-3 text-sm text-error;
                }

                .aviso-exito {
                    @apply rounded-md border border-exito/30 bg-exito/5 px-4 py-3 text-sm text-exito;
                }

                /* aviso que sale abajo en vez de los alert, lo crea la funcion avisar del js */
                .aviso-flotante {
                    @apply fixed bottom-6 left-1/2 z-50 w-max max-w-[calc(100%-2rem)] -translate-x-1/2 rounded-lg bg-texto px-4 py-3 text-sm font-medium text-white shadow-lg transition duration-200 ease-out;
                    animation: aparecer 200ms ease-out;
                }

                /* el aviso en rojo cuando es un error */
                .aviso-flotante-error {
                    @apply bg-error;
                }

                /* cuando se va, baja un poco y se desvanece */
                .aviso-flotante-saliendo {
                    @apply opacity-0 translate-y-2;
                }

                /* boton rojo para borrar, se pone junto con .btn */
                .btn-peligro {
                    @apply bg-error hover:bg-error/85 active:bg-error;
                }

                /* ventana de confirmar borrado (la del fragmento confirmar) */
                .dialogo {
                    @apply m-auto w-[calc(100%-2rem)] max-w-sm rounded-xl border border-borde bg-superficie text-texto shadow-xl backdrop:bg-texto/40;
                }

                .dialogo-contenido {
                    @apply flex flex-col gap-2 p-6;
                }

                .dialogo-botones {
                    @apply flex justify-end gap-3 pt-4;
                }

                /* paneles y secciones */

                .panel {
                    @apply bg-superficie border border-borde rounded-xl p-5 md:p-6;
                }

                .seccion {
                    @apply flex flex-col gap-6 py-8 max-w-3xl;
                }

                .seccion-estrecha {
                    @apply max-w-md;
                }

                .titulo-seccion {
                    @apply text-2xl md:text-3xl font-bold leading-tight tracking-tight;
                }

                .subtitulo {
                    @apply text-base font-semibold;
                }

                .texto-suave {
                    @apply text-sm text-texto-suave;
                }

                /* lista de datos, etiqueta a un lado y valor al otro */
                .ficha {
                    @apply grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 text-sm;
                }

                .ficha dt {
                    @apply text-texto-suave;
                }

                .ficha dd {
                    @apply font-medium;
                }

                /* catalogo */

                .barra-catalogo {
                    @apply flex flex-wrap items-center justify-between gap-3 pt-6;
                }

                .buscador {
                    @apply w-full sm:w-72;
                }

                .paginacion {
                    @apply flex items-center gap-3 text-sm text-texto-suave;
                }

                .catalogo {
                    @apply grid grid-cols-2 gap-x-4 gap-y-10 py-6 md:grid-cols-3 md:gap-x-6 md:gap-y-12 lg:grid-cols-4;
                }

                .tarjeta-producto {
                    @apply flex flex-col gap-3;
                }

                .vitrina {
                    @apply aspect-square bg-superficie border border-borde rounded-xl overflow-hidden flex items-center justify-center p-4;
                }

                .imagen-vitrina {
                    @apply w-full h-full object-contain transition-transform duration-300 ease-out hover:scale-105 motion-reduce:transition-none motion-reduce:hover:scale-100;
                }

                .tarjeta-info {
                    @apply flex flex-col gap-0.5;
                }

                .tarjeta-titulo {
                    @apply font-semibold leading-snug text-balance;
                }

                .tarjeta-datos {
                    @apply flex flex-wrap justify-between items-baseline gap-x-2 gap-y-1 text-sm text-texto-suave *:whitespace-nowrap;
                }

                .tarjeta-precio {
                    @apply text-base font-bold text-texto tabular-nums;
                }

                .tarjeta-acciones {
                    @apply mt-auto flex flex-col gap-2 text-sm;
                }

                /* detalle de una figura */

                .detalle {
                    @apply grid gap-8 py-8 md:grid-cols-2 md:gap-12 md:items-start;
                }

                .detalle .vitrina {
                    @apply p-8;
                }

                .detalle-info {
                    @apply flex flex-col gap-5;
                }

                .detalle-precio {
                    @apply text-3xl font-bold tabular-nums;
                }

                .detalle-comprar {
                    @apply flex flex-wrap items-end gap-3 border-t border-borde pt-5;
                }

                /* carrito y pedido */

                .lista-carrito {
                    @apply flex flex-col;
                }

                .fila-carrito {
                    @apply flex flex-wrap items-center gap-x-4 gap-y-2 py-4 border-b border-borde last:border-b-0;
                }

                .vitrina-mini {
                    @apply w-20 p-2 rounded-lg;
                }

                .fila-carrito-info {
                    @apply flex flex-col gap-0.5 flex-1 min-w-32;
                }

                .pasos {
                    @apply text-xs font-semibold uppercase tracking-wider text-texto-suave;
                }

                .bloque-resumen {
                    @apply flex flex-col gap-2 border-t border-borde pt-4 first:border-t-0 first:pt-0;
                }

                /* administracion */

                .admin-cabecera {
                    @apply border-b border-borde bg-superficie;
                }

                .admin-menu {
                    @apply flex flex-wrap items-center gap-1 text-sm;
                }

                .admin-menu a {
                    @apply rounded-md px-3 py-1.5 font-medium text-texto-suave transition-colors hover:bg-fondo hover:text-texto;
                }

                .admin-titulo {
                    @apply flex flex-wrap items-center justify-between gap-3 pt-8 pb-4;
                }

                .tabla {
                    @apply w-full text-sm;
                }

                .tabla th {
                    @apply text-left font-medium text-texto-suave px-3 py-2 border-b border-borde whitespace-nowrap;
                }

                .tabla td {
                    @apply px-3 py-3 border-b border-borde align-middle;
                }

                .tabla tr:last-child td {
                    @apply border-b-0;
                }

                .tabla-contenedor {
                    @apply bg-superficie border border-borde rounded-xl overflow-x-auto;
                }

                .miniatura {
                    @apply w-12 h-12 rounded-md object-contain bg-fondo border border-borde;
                }

                .acciones-fila {
                    @apply flex gap-3 whitespace-nowrap;
                }

                .enlace-peligro {
                    @apply text-error underline-offset-4 hover:underline;
                }

                .etiqueta-estado {
                    @apply inline-block rounded-full bg-acento/60 px-2.5 py-0.5 text-xs font-medium;
                }
            }

            /* animacion del aviso flotante: sube un poco al salir
               (sin empezar invisible, asi si no se anima tambien se lee) */
            @keyframes aparecer {
                from { translate: -50% 0.75rem; }
                to { translate: -50% 0; }
            }

            /* si el usuario tiene puesto reducir movimiento, sin animacion */
            @media (prefers-reduced-motion: reduce) {
                .aviso-flotante {
                    animation: none;
                    transition: none;
                }
            }
        </style>

        <!-- el script de tailwind tiene que ir despues del style
             si va antes a veces lee el style a medias y no pone los estilos -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </th:block>
</head>
</html>
