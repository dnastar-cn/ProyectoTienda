<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style type="text/tailwindcss">
            @theme {
                --color-fondo: #fde68a;
                --color-error: #dc2626;
                --color-primario: #2529DC;
                --font-sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
                --color-texto-suave: #5c5346;
            }

            @layer base {
                body {
                    @apply bg-fondo;
                }
                :focus-visible {
                    @apply outline-2 outline-offset-2 outline-primario;
                }
            }
            
            @layer components {
                .imagen-producto{
                    @apply h-35 m-2.5 transition-all duration-400 hover:scale-120;
                }

                .vitrina {
                    @apply aspect-square bg-white rounded-lg overflow-hidden flex items-center justify-center p-4;
                }

                .imagen-vitrina {
                    @apply w-full h-full object-contain transition-transform duration-300 ease-out hover:scale-105 motion-reduce:transition-none motion-reduce:hover:scale-100;
                }

                .tarjeta-titulo {
                    @apply font-semibold leading-snug text-balance;
                }

                .tarjeta-producto {
                    @apply flex flex-col gap-3;
                }

                .tarjeta-info {
                    @apply flex flex-col gap-0.5;
                }

                .tarjeta-datos {
                    @apply flex flex-wrap justify-between items-baseline gap-x-2 gap-y-1 text-sm text-texto-suave *:whitespace-nowrap;
                }

                .tarjeta-precio {
                    @apply text-base font-bold text-black tabular-nums;
                }

                .tarjeta-acciones {
                    @apply mt-auto flex flex-col gap-2 text-sm;
                }

                .input {
                    @apply bg-white border rounded px-1 py-1.5;
                }

                .input-cantidad{
                    @apply text-right pr-2 w-12.5;
                }

                .menu-principal {
                    @apply flex flex-wrap;
                }

                .menu-principal a{
                    @apply m-2.5 underline;
                }

                /* enlaces que solo ve el usuario identificado: el JS los muestra al iniciar sesion */
                .enlace-carrito, .enlace-pedidos, .enlace-mis_datos, .enlace-cerrar_sesion {
                    @apply hidden;
                }

                .usuario-actual {
                    @apply text-right text-sm font-semibold px-4 pt-2;
                }

                .mensaje-error{
                    @apply text-error;
                }

                .btn {
                    @apply bg-primario text-white px-4 py-2 rounded-md transition-colors hover:bg-primario/85;
                }

                .catalogo {
                    @apply grid grid-cols-2 gap-x-4 gap-y-10 p-4 md:grid-cols-3 md:gap-x-6 md:gap-y-12 md:p-6 lg:grid-cols-4;
                }

                /* paginas de una columna: carrito y pasos del pedido */
                .seccion {
                    @apply flex flex-col gap-6 p-4 md:p-6 max-w-3xl;
                }

                .seccion-estrecha {
                    @apply max-w-md;
                }

                .titulo-seccion {
                    @apply text-2xl font-bold leading-tight;
                }

                .texto-suave {
                    @apply text-sm text-texto-suave;
                }

                .lista-carrito {
                    @apply flex flex-col;
                }

                .fila-carrito {
                    @apply flex flex-wrap items-center gap-x-4 gap-y-2 py-4 border-b border-texto-suave/25;
                }

                .vitrina-mini {
                    @apply w-20 p-2;
                }

                .fila-carrito-info {
                    @apply flex flex-col gap-0.5 flex-1 min-w-32;
                }

                .formulario {
                    @apply flex flex-col gap-4;
                }

                .campo {
                    @apply flex flex-col gap-1 text-sm text-texto-suave;
                }
            }
        </style>
    </th:block>
</head>
</html>
