<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="estilos">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <style type="text/tailwindcss">
            @theme {
                --color-fondo: #fde68a;
                --color-error: #dc2626;
                --color-primario: #2529DC;
                --font-sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
                --color-texto-suave: #5c5346;
            }

            @layer base {
                body {
                    @apply bg-fondo;
                }
            }
            
            @layer components {
                .imagen-producto{
                    @apply h-35 m-2.5 transition-all duration-400 hover:scale-120;
                }

                .vitrina {
                    @apply aspect-square bg-white rounded-lg overflow-hidden flex items-center justify-center p-4;
                }

                .imagen-vitrina {
                    @apply w-full h-full object-contain transition-transform duration-300 ease-out hover:scale-105;
                }

                .tarjeta-titulo {
                    @apply font-semibold leading-snug text-balance;
                }

                .tarjeta-producto {
                    @apply flex flex-col gap-3;
                }

                .tarjeta-info {
                    @apply flex flex-col gap-0.5;
                }

                .tarjeta-datos {
                    @apply flex justify-between items-baseline text-sm text-texto-suave;
                }

                .tarjeta-precio {
                    @apply text-base font-bold text-black tabular-nums;
                }

                .tarjeta-acciones {
                    @apply mt-auto flex flex-col gap-2 text-sm;
                }

                .input{
                    @apply bg-white border;
                }

                .input-cantidad{
                    @apply text-right pr-2 w-12.5;
                }

                .menu-principal a{
                    @apply m-2.5 underline;
                }

                .mensaje-error{
                    @apply text-error;
                }

                .btn{
                    @apply bg-primario text-white p-2;
                }

                .catalogo {
                    @apply grid grid-cols-2 gap-x-6 gap-y-12 p-6 md:grid-cols-3 lg:grid-cols-4;
                }
            }
        </style>
    </th:block>
</head>
</html>
