<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso a administración</title>
    <th:block th:insert="~{fragments/estilos.html :: estilos}"></th:block>
</head>
<body>

<main class="pagina min-h-screen flex items-center justify-center">
    <div class="seccion seccion-estrecha w-full">
        <div>
            <h1 class="titulo-seccion">Administración</h1>
            <p class="texto-suave">No puedes acceder a la administración hasta que te identifiques.</p>
        </div>

        <form action="admin/gestionarFiguras" class="panel formulario">
            <label class="campo">
                Contraseña
                <input type="password" name="pass-login-admin" class="input" autofocus>
            </label>
            <input type="submit" value="Entrar" class="btn">
        </form>

        <a href="./" class="enlace text-sm self-start">← Volver a la tienda</a>
    </div>
</main>

</body>
</html>
