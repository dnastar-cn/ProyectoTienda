<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:insert="~{fragments/estilos.html :: estilos}"></th:block>
</head>
<body>

<div th:insert="fragments/general.html :: menu"></div>

<div>listar productos, permitiendo borrar y editar</div>
<div>
    <a href="registrarFigura">Nuevo producto</a>
</div>

<div th:each="f : ${figuras}" class="m-4">
    titulo: <span th:text="${f.titulo}"></span>
    <br>
    categoria: <span th:text="${f.categoria.nombre}"></span>
    <br>
    <img th:src="@{${ '../mostrar_imagen?id=' + f.id }}" height="80px"/>
    <br>
    plataforma: <span th:text="${f.plataforma}"></span>
    <br>
    descripcion: <span th:text="${f.descripcion}"></span>
    <br>
    precio: <span th:text="${f.precio}"></span>
    <br>
    <a th:href="@{${ 'borrarFigura?id=' + f.id }}" onclick="return confirm('estas seguro rey?')">BORRAR</a>
    <br>
    <a th:href="@{${ 'editarFigura?id=' + f.id }}">Editar</a>


</div>

</body>
</html>
