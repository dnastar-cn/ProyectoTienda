<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:insert="~{fragments/estilos.html :: estilos}"></th:block>
</head>
<body>

<div th:insert="fragments/general.html :: menu"></div>

<div>introduce los datos del nuevo producto</div>

<form action="#" th:action="guardarFigura" th:object="${nuevo}" method="post" enctype="multipart/form-data">
    titulo: <input type="text" th:field="*{titulo}">

    <span style="color: red" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>

    <br>
    precio: <input type="text" th:field="*{precio}">

    <span style="color: red" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>

    <br>

    categoria:
    <select th:field="*{idCategoria}">
        <option th:each="c : ${categorias}" th:text="${c.nombre}" th:value="${c.id}" />
    </select>

    <br>
    plataforma: <input type="text" th:field="*{plataforma}">
    <br>
    descripcion: <input type="text" th:field="*{descripcion}">
    <br>
    portada: <input type="file" th:field="*{fotoSubida}">
    <br>


    <input type="submit" value="REGISTRAR">
</form>

</body>
</html>
