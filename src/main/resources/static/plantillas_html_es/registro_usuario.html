<div class="seccion seccion-estrecha">
    <div>
        <h1 class="titulo-seccion">Crear una cuenta</h1>
        <p class="texto-suave">Introduce tus datos para registrarte.</p>
    </div>

    <form id="form_registro_usuario" class="panel formulario">
        <label class="campo" for="nombre">
            Nombre
            <input type="text" id="nombre" name="nombre" class="input">
        </label>

        <label class="campo" for="email">
            Email
            <input type="email" id="email" name="email" class="input">
        </label>

        <label class="campo" for="pass">
            Contraseña
            <input type="password" id="pass" name="pass" class="input" />
        </label>

        <label class="campo" for="avatar">
            Avatar (opcional)
            <input type="file" id="avatar" name="avatar" accept="image/*" class="text-sm file:mr-3 file:rounded-md file:border file:border-borde file:bg-superficie file:px-3 file:py-1.5 file:font-medium file:text-texto file:cursor-pointer">
        </label>

        <button type="submit" class="btn">Registrarse</button>
    </form>
</div>
