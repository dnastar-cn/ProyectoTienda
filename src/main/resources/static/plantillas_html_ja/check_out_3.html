<div class="seccion seccion-estrecha">
    <div>
        <h1 class="titulo-seccion">ご注文内容の確認</h1>
        <p class="texto-suave">ご注文手続き · ステップ 3/3</p>
    </div>

    <div class="formulario">
        <div>
            <h2 class="tarjeta-titulo">注文商品</h2>
            <div>
                {{#figuras}}
                    <div class="p-10">
                        {{TITULO_FIGURA}}<br>
                        単価: {{PRECIO}} ユーロ <br>
                        数量: {{CANTIDAD}} <br>
                    </div>
                {{/figuras}}
            </div>
        </div>
        <div>
            <h2 class="tarjeta-titulo">配送先情報</h2>
            <div>
                氏名: {{nombreCompleto}}<br>
                住所: {{direccion}}<br>
                県: {{provincia}}<br>
            </div>
            <p class="texto-suave">（準備中...）</p>
        </div>
        <div>
            <h2 class="tarjeta-titulo">お支払い情報</h2>
            <div>
                カードの種類: {{tipoTarjeta}}<br>
                カード名義人: {{titularTarjeta}}<br>
                カード番号: {{numeroTarjeta}}<br>
            </div>
        </div>
    </div>

    <button id="boton_confirmar_pedido" class="btn self-start">注文を確定する</button>
</div>
