<div class="seccion seccion-estrecha">
    <div>
        <h1 class="titulo-seccion">ログイン</h1>
        <p class="texto-suave">ログイン情報を入力してください。</p>
    </div>

    <form id="form_login" class="panel formulario">
        <label class="campo">
            メールアドレス
            <input type="email" name="email" id="email" class="input" value="pepe@gmail.com" />
        </label>
        <label class="campo">
            パスワード
            <input type="password" name="pass" id="pass" class="input" value="123" />
        </label>
        <label class="casilla">
            <input type="checkbox" id="recordar_pass"/>
            ログイン情報を記憶する
        </label>
        <input type="submit" value="ログイン" class="btn"/>
    </form>
</div>
