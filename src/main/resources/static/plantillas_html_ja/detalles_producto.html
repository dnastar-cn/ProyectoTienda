
<!--esto es otra plantilla para mustache-->
<div class="detalle">

    <div class="vitrina">
        <img class="imagen-vitrina" src="mostrar_imagen?id={{ID}}" alt="{{TITULO}}"/>
    </div>

    <div class="detalle-info">
        <a href="#" class="enlace text-sm self-start" onclick="mostrar_figura()">← カタログに戻る</a>

        <h1 class="titulo-seccion">{{TITULO}}</h1>

        <p class="detalle-precio">{{PRECIO}} €</p>

        <p>{{DESCRIPCION}}</p>

        <dl class="ficha">
            <dt>カテゴリー</dt>
            <dd>{{CATEGORIA}}</dd>
            <dt>メーカー</dt>
            <dd>{{FABRICANTE}}</dd>
            <dt>高さ</dt>
            <dd>{{ALTURA}} cm</dd>
            <dt>素材</dt>
            <dd>{{MATERIAL}}</dd>
        </dl>

        <div class="detalle-comprar">
            <label class="campo">
                数量
                <input class="input input-cantidad" type="number" value="1" min="1" id="cantidad_{{ID}}">
            </label>
            <a href="#" class="btn" onclick="agregarProductoCarrito({{ID}})">カートに追加</a>
        </div>
    </div>

</div>
