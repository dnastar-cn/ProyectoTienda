<div class="seccion">
    <h1 class="titulo-seccion">Your cart</h1>

    <div class="panel lista-carrito py-1">
    {{#.}}
        <div class="fila-carrito">
            <div class="vitrina vitrina-mini">
                <img class="imagen-vitrina" src="mostrar_imagen?id={{FIGURA_ID}}" alt="{{TITULO}}">
            </div>
            <div class="fila-carrito-info">
                <h2 class="tarjeta-titulo">{{TITULO}}</h2>
                <span class="tarjeta-precio">{{PRECIO}} €</span>
            </div>
            <label class="texto-suave">
                Quantity
                <input class="input input-cantidad" type="number" value="{{CANTIDAD}}" min="1" onchange="cambiar_cantidad({{FIGURA_ID}}, this.value)">
            </label>
            <a href="#" class="enlace-peligro text-sm" onclick="cambiar_cantidad({{FIGURA_ID}}, 0); return false">Remove item</a>
        </div>
    {{/.}}
    {{^.}}
        <p class="texto-suave py-6 text-center">Your cart is empty.</p>
    {{/.}}
    </div>

    <a class="btn self-start" href="#" id="realizar_pedido">Place order</a>
</div>
