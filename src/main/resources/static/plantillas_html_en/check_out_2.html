<div class="seccion seccion-estrecha">
    <div>
        <h1 class="titulo-seccion">Payment details</h1>
        <p class="texto-suave">Checkout · step 2 of 3</p>
    </div>

    <div class="formulario">
        <label class="campo">
            Card type
            <select id="tipo_tarjeta" class="input">
                <option value="0">Choose type</option>
                <option value="visa">VISA</option>
                <option value="master_card">MASTER CARD</option>
            </select>
        </label>
        <label class="campo">
            Card number
            <input type="text" id="numero_tarjeta" class="input" />
        </label>
        <label class="campo">
            Cardholder name
            <input type="text" id="titular_tarjeta" class="input" />
        </label>
    </div>

    <button id="aceptar_paso_2" class="btn self-start">Continue</button>
</div>
