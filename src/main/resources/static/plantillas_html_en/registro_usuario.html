<div>
    enter your details to sign up<br/>
    <form id="form_registro_usuario">
        <label for="nombre">name:</label>
        <input type="text" id="nombre" name="nombre" class="input" ><br/>

        <label for="email">email:</label>
        <input type="email" id="email" name="email"  class="input"><br/>

        <label for="pass">password:</label>
        <input type="password" id="pass" name="pass"  class="input" /><br/>

        <label for="avatar">avatar (optional):</label>
        <input type="file" id="avatar" name="avatar"  class="input"><br/><br/>

        <button type="submit" class="btn">Sign up</button>
    </form>
</div>
