
<!--esto es otra plantilla para mustache-->
<div class="detalle">

    <div class="vitrina">
        <img class="imagen-vitrina" src="mostrar_imagen?id={{ID}}" alt="{{TITULO}}"/>
    </div>

    <div class="detalle-info">
        <a href="#" class="enlace text-sm self-start" onclick="mostrar_figura()">← Back to catalogue</a>

        <h1 class="titulo-seccion">{{TITULO}}</h1>

        <p class="detalle-precio">{{PRECIO}} €</p>

        <p>{{DESCRIPCION}}</p>

        <dl class="ficha">
            <dt>Category</dt>
            <dd>{{CATEGORIA}}</dd>
            <dt>Manufacturer</dt>
            <dd>{{FABRICANTE}}</dd>
            <dt>Height</dt>
            <dd>{{ALTURA}} cm</dd>
            <dt>Material</dt>
            <dd>{{MATERIAL}}</dd>
        </dl>

        <div class="detalle-comprar">
            <label class="campo">
                Quantity
                <input class="input input-cantidad" type="number" value="1" min="1" id="cantidad_{{ID}}">
            </label>
            <a href="#" class="btn" onclick="agregarProductoCarrito({{ID}})">Add to cart</a>
        </div>
    </div>

</div>
