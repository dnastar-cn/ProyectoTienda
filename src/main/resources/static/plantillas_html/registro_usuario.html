<div>
    introduce tus datos para registrarte<br/>
    <form id="form_registro_usuario">
        <label for="nombre">nombre:</label>
        <input type="text" id="nombre" name="nombre" class="border" ><br/>

        <label for="email">email:</label>
        <input type="email" id="email" name="email"  class="border"><br/>

        <label for="pass">pass:</label>
        <input type="password" id="pass" name="pass"  class="border" /><br/>

        <label for="avatar">avatar (opcional):</label>
        <input type="file" id="avatar" name="avatar"  class="border"><br/><br/>

        <button type="submit" class="bg-blue-200 p-2">Registrarse</button>
    </form>
</div>
