{{#.}}

<!-- esta es la nomenclatura de mustache.js
 con esto indicamos que el html que haya aqui se pueda usar para aplicarlo sobre
 cada elemento de un array-->

<div class="tarjeta-producto">
    titulo: {{TITULO}} <br>
    categoria: {{CATEGORIA}}<br>
    <img class="imagen-producto" src="mostrar_imagen?id={{ID}}"/>
    precio: {{PRECIO}} <br>
    plataforma: {{PLATAFORMA}} <br>
    <a href="#" class="underline" onclick="mostrar_detalles({{ID}})">ver detalles</a><br>
    cantidad: <input class="input input-cantidad" type="number" value="1" >
    <br>
    <a href="#" class="underline" onclick="agregarProductoCarrito({{ID}})">agregar al carrito</a>
</div>

{{/.}}
